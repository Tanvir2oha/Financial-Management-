name: Build Capt Toha Finance Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Set up Android SDK & Gradle
        uses: android-actions/setup-android@v3

      - name: 4. Setup Gradle Action
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Generate Complete Native Android SMS-Sync Project
        run: |
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/java/com/capttoha/finflow
          mkdir -p android-project/app/src/main/res/values

          cp index.html android-project/app/src/main/assets/index.html

          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CaptTohaFinance"
          include ':app'
          EOF

          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.capttoha.finflow'
              compileSdk 34

              defaultConfig {
                  applicationId "com.capttoha.finflow"
                  minSdk 24
                  targetSdk 34
                  versionCode 2
                  versionName "1.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.webkit:webkit:1.10.0'
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Capt Toha Finance</string>
          </resources>
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECEIVE_SMS" />
              <uses-permission android:name="android.permission.READ_SMS" />

              <application
                  android:allowBackup="true"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".SmsReceiver"
                      android:exported="true"
                      android:permission="android.permission.BROADCAST_SMS">
                      <intent-filter android:priority="999">
                          <action android:name="android.provider.Telephony.SMS_RECEIVED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/capttoha/finflow/SmsReceiver.kt
          package com.capttoha.finflow

          import android.content.BroadcastReceiver
          import android.content.Context
          import android.content.Intent
          import android.provider.Telephony
          import org.json.JSONArray
          import org.json.JSONObject

          class SmsReceiver : BroadcastReceiver() {
              override fun onReceive(context: Context, intent: Intent) {
                  if (intent.action == Telephony.Sms.Intents.SMS_RECEIVED_ACTION) {
                      val msgs = Telephony.Sms.Intents.getMessagesFromIntent(intent)
                      if (msgs.isNullOrEmpty()) return

                      val sender = msgs[0]?.originatingAddress ?: "Unknown"
                      val body = msgs.joinToString("") { it.messageBody ?: "" }
                      val ts = System.currentTimeMillis()

                      val prefs = context.getSharedPreferences("TohaSmsQueue", Context.MODE_PRIVATE)
                      val existingJson = prefs.getString("pending_sms", "[]") ?: "[]"
                      val arr = JSONArray(existingJson)

                      val obj = JSONObject().apply {
                          put("sender", sender)
                          put("body", body)
                          put("ts", ts)
                      }
                      arr.put(obj)
                      prefs.edit().putString("pending_sms", arr.toString()).apply()

                      MainActivity.flushSmsIfReady(context)
                  }
              }
          }
          EOF

          # MainActivity.kt with 30-Day ContentResolver Inbox Scanner Bridge
          cat << 'EOF' > android-project/app/src/main/java/com/capttoha/finflow/MainActivity.kt
          package com.capttoha.finflow

          import android.Manifest
          import android.annotation.SuppressLint
          import android.content.Context
          import android.content.pm.PackageManager
          import android.net.Uri
          import android.os.Bundle
          import android.webkit.JavascriptInterface
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          import org.json.JSONArray
          import org.json.JSONObject

          class MainActivity : AppCompatActivity() {

              companion object {
                  var webViewRef: WebView? = null
                  var pageLoaded: Boolean = false

                  fun flushSmsIfReady(context: Context) {
                      val wv = webViewRef ?: return
                      if (!pageLoaded) return

                      val prefs = context.getSharedPreferences("TohaSmsQueue", Context.MODE_PRIVATE)
                      val existingJson = prefs.getString("pending_sms", "[]") ?: "[]"
                      val arr = JSONArray(existingJson)
                      if (arr.length() == 0) return

                      prefs.edit().putString("pending_sms", "[]").apply()

                      wv.post {
                          for (i in 0 until arr.length()) {
                              val item = arr.getJSONObject(i)
                              val s = JSONObject.quote(item.optString("sender", "Bank"))
                              val b = JSONObject.quote(item.optString("body", ""))
                              val t = item.optLong("ts", System.currentTimeMillis())
                              wv.evaluateJavascript(
                                  "if(window.onNativeSmsReceived){window.onNativeSmsReceived($s,$b,$t);}",
                                  null
                              )
                          }
                      }
                  }
              }

              inner class SmsJsBridge(private val ctx: Context) {
                  @JavascriptInterface
                  fun scanPastSms(days: Int): Int {
                      if (ContextCompat.checkSelfPermission(ctx, Manifest.permission.READ_SMS)
                          != PackageManager.PERMISSION_GRANTED) {
                          requestSmsPermissions()
                          return 0
                      }

                      val cutoffTime = System.currentTimeMillis() - (days.toLong() * 24L * 60L * 60L * 1000L)
                      val uri = Uri.parse("content://sms/inbox")
                      val projection = arrayOf("address", "body", "date")
                      val selection = "date >= ?"
                      val selectionArgs = arrayOf(cutoffTime.toString())
                      val sortOrder = "date ASC"

                      val finRegex = Regex("(?i)(bdt|tk|taka|bkash|nagad|rocket|tbl|trust|city|brac|dbbl|ebl|credited|debited|trxid|avl bal)")
                      var matchedCount = 0

                      val cursor = ctx.contentResolver.query(uri, projection, selection, selectionArgs, sortOrder)
                      cursor?.use { c ->
                          val addrIdx = c.getColumnIndexOrThrow("address")
                          val bodyIdx = c.getColumnIndexOrThrow("body")
                          val dateIdx = c.getColumnIndexOrThrow("date")

                          while (c.moveToNext()) {
                              val sender = c.getString(addrIdx) ?: "Unknown"
                              val body = c.getString(bodyIdx) ?: ""
                              val ts = c.getLong(dateIdx)

                              if (finRegex.containsMatchIn(body) || finRegex.containsMatchIn(sender)) {
                                  matchedCount++
                                  val s = JSONObject.quote(sender)
                                  val b = JSONObject.quote(body)
                                  webViewRef?.post {
                                      webViewRef?.evaluateJavascript(
                                          "if(window.onNativeSmsReceived){window.onNativeSmsReceived($s,$b,$ts);}",
                                          null
                                      )
                                  }
                              }
                          }
                      }
                      return matchedCount
                  }
              }

              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val webView = WebView(this)
                  setContentView(webView)
                  webViewRef = webView

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                  }

                  webView.addJavascriptInterface(SmsJsBridge(this), "AndroidSmsBridge")
                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = object : WebViewClient() {
                      override fun onPageFinished(view: WebView?, url: String?) {
                          super.onPageFinished(view, url)
                          pageLoaded = true
                          flushSmsIfReady(this@MainActivity)
                      }
                  }

                  webView.loadUrl("file:///android_asset/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })

                  requestSmsPermissions()
              }

              override fun onResume() {
                  super.onResume()
                  flushSmsIfReady(this)
              }

              override fun onDestroy() {
                  pageLoaded = false
                  webViewRef = null
                  super.onDestroy()
              }

              private fun requestSmsPermissions() {
                  val needed = arrayOf(
                      Manifest.permission.RECEIVE_SMS,
                      Manifest.permission.READ_SMS
                  ).filter {
                      ContextCompat.checkSelfPermission(this, it) != PackageManager.PERMISSION_GRANTED
                  }
                  if (needed.isNotEmpty()) {
                      ActivityCompat.requestPermissions(this, needed.toTypedArray(), 1001)
                  }
              }
          }
          EOF

      - name: 6. Compile Native Debug APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: 7. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capt-Toha-Finance-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
