name: Build Capt Toha Finance Native APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: 4. Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: 5. Generate Clean Android Project with Custom App Icon
        run: |
          mkdir -p android-project/app/src/main/assets
          mkdir -p android-project/app/src/main/java/com/capttoha/finflow
          mkdir -p android-project/app/src/main/res/values
          mkdir -p android-project/app/src/main/res/drawable
          mkdir -p android-project/app/src/main/res/mipmap-anydpi-v26

          if [ -f "index.html" ]; then
            cp index.html android-project/app/src/main/assets/index.html
          elif [ -f "README.md" ]; then
            cp README.md android-project/app/src/main/assets/index.html
          fi

          cat << 'EOF' > android-project/settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CaptTohaFinance"
          include ':app'
          EOF

          cat << 'EOF' > android-project/build.gradle
          plugins {
              id 'com.android.application' version '8.3.2' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.22' apply false
          }
          EOF

          cat << 'EOF' > android-project/gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          EOF

          cat << 'EOF' > android-project/app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.capttoha.finflow'
              compileSdk 34

              defaultConfig {
                  applicationId "com.capttoha.finflow"
                  minSdk 26
                  targetSdk 34
                  versionCode 4
                  versionName "2.1"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
          }
          EOF

          cat << 'EOF' > android-project/app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Capt Toha Finance</string>
          </resources>
          EOF

          # Custom Icon Background (Deep Military/Fintech Slate & Emerald)
          cat << 'EOF' > android-project/app/src/main/res/drawable/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#090D16"
                  android:pathData="M0,0h108v108h-108z"/>
              <path
                  android:fillColor="#064E3B"
                  android:pathData="M0,70 L108,35 L108,108 L0,108 Z"/>
          </vector>
          EOF

          # Custom Icon Foreground ("TT" Monogram + Emerald Shield Border)
          cat << 'EOF' > android-project/app/src/main/res/drawable/ic_launcher_foreground.xml
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <!-- Outer Emerald Ring -->
              <path
                  android:fillColor="#10B981"
                  android:pathData="M54,24 C70.57,24 84,37.43 84,54 C84,70.57 70.57,84 54,84 C37.43,84 24,70.57 24,54 C24,37.43 37.43,24 54,24 Z M54,28 C39.64,28 28,39.64 28,54 C28,68.36 39.64,80 54,80 C68.36,80 80,68.36 80,54 C80,39.64 68.36,28 54,28 Z"/>
              <!-- First "T" (Gold/Amber) -->
              <path
                  android:fillColor="#FBBF24"
                  android:pathData="M34,40 H52 V45 H45.5 V68 H40.5 V45 H34 Z"/>
              <!-- Second "T" (Emerald White) -->
              <path
                  android:fillColor="#ECFDF5"
                  android:pathData="M56,40 H74 V45 H67.5 V68 H62.5 V45 H56 Z"/>
          </vector>
          EOF

          # Adaptive Launcher Icon Binding
          cat << 'EOF' > android-project/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@drawable/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF

          cat << 'EOF' > android-project/app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > android-project/app/src/main/java/com/capttoha/finflow/MainActivity.kt
          package com.capttoha.finflow

          import android.annotation.SuppressLint
          import android.os.Bundle
          import android.webkit.WebChromeClient
          import android.webkit.WebView
          import android.webkit.WebViewClient
          import androidx.activity.OnBackPressedCallback
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              @SuppressLint("SetJavaScriptEnabled")
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val webView = WebView(this)
                  setContentView(webView)

                  webView.settings.apply {
                      javaScriptEnabled = true
                      domStorageEnabled = true
                      databaseEnabled = true
                      allowFileAccess = true
                  }

                  webView.webChromeClient = WebChromeClient()
                  webView.webViewClient = WebViewClient()
                  webView.loadUrl("file:///android_asset/index.html")

                  onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                      override fun handleOnBackPressed() {
                          if (webView.canGoBack()) webView.goBack() else finish()
                      }
                  })
              }
          }
          EOF

      - name: 6. Compile Native Debug APK
        working-directory: android-project
        run: gradle assembleDebug

      - name: 7. Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Capt-Toha-Finance-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
